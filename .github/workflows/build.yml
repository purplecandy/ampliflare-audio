# Builds, signs and packages the app on every platform.
# Runs on pull requests and pushes to main, and is called by release.yml for tags.
#
# Secrets (all optional here, all required for a release):
#   MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY   Developer ID identity
#   MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER  App Store Connect API key
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater signing key
# Without them the build still runs. macOS is signed ad hoc, there are no updater
# files, and the artifact name ends in "-unsigned". Pull requests from forks never
# see secrets, so they always get that build.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Fail instead of skipping when signing secrets are missing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow_ref }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg
      - run: node scripts/ci/check-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ./scripts/fetch-sidecars.sh
      - run: cargo test --locked
        working-directory: src-tauri

  package:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      # Job level so each step's `if` can see whether a secret exists.
      # Mac signing needs all six. With only some, build unsigned instead of failing halfway.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' && secrets.MACOS_NOTARY_KEY != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide what gets signed
        id: mode
        run: |
          signed=true
          [[ "$HAS_UPDATER_KEY" == "true" ]] || signed=false
          [[ "$RUNNER_OS" != "macOS" || "$HAS_MACOS_SIGNING" == "true" ]] || signed=false
          if [[ "$signed" == "false" && "${{ inputs.release }}" == "true" ]]; then
            echo "::error::A release needs every signing secret. See the header of build.yml."
            exit 1
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "version=$(node scripts/ci/check-version.mjs)" >> "$GITHUB_OUTPUT"
          [[ "$signed" == "true" ]] || echo "::warning::Building without signing secrets. Output is not notarized and has no updater files."

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - run: pnpm install --frozen-lockfile
      - run: ./scripts/fetch-sidecars.sh ${{ matrix.target }}

      - name: Set up signing keychain
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: ./scripts/ci/macos-keychain.sh setup

      - name: Build
        env:
          # macOS: sign with the Developer ID when we have one, else ad hoc.
          APPLE_SIGNING_IDENTITY: ${{ env.HAS_MACOS_SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's strip breaks on some newer system libraries.
          NO_STRIP: "true"
          APP_VERSION: ${{ steps.mode.outputs.version }}
        run: |
          # A missing secret arrives as an empty string. Tauri treats a set but
          # empty variable as a real value, so drop the empty ones.
          for v in APPLE_API_KEY APPLE_API_ISSUER TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!v}" ]] || unset "$v"
          done
          args=(--ci --target "${{ matrix.target }}")
          # MSI only takes numeric versions, so a pre-release like 0.2.0-beta.1 ships NSIS only.
          if [[ "$RUNNER_OS" == "Windows" && "$APP_VERSION" == *-* ]]; then
            args+=(--bundles nsis)
          fi
          if [[ "$HAS_UPDATER_KEY" != "true" ]]; then
            # A file, not inline JSON, so no shell on Windows can strip the quotes.
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > no-updater.conf.json
            args+=(--config no-updater.conf.json)
          fi
          pnpm tauri build "${args[@]}"

      - name: Collect bundles
        run: node scripts/ci/collect-bundles.mjs "${{ matrix.target }}" dist

      - name: Sign deb and rpm for the updater
        if: runner.os == 'Linux' && env.HAS_UPDATER_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in dist/*.deb dist/*.rpm; do
            [[ -f "$f.sig" ]] || pnpm tauri signer sign "$f"
          done

      - name: Notarize and check the disk image
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: ./scripts/ci/macos-notarize-dmg.sh dist/*.dmg

      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: ./scripts/ci/macos-keychain.sh cleanup

      - name: Write checksums
        run: |
          cd dist
          for f in *; do
            [[ "$f" == *.sig ]] && continue
            if command -v sha256sum > /dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ampliflare-audio-${{ steps.mode.outputs.version }}-${{ matrix.target }}${{ steps.mode.outputs.signed == 'false' && '-unsigned' || '' }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.release && 7 || 14 }}
